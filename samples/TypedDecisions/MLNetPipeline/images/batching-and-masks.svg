<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1080" viewBox="0 0 900 1080" role="img" aria-labelledby="title desc">
  <title id="title">Question-row batching and masks</title>
  <desc id="desc">Two source states each produce three logical question rows. Captured per-source prepared shapes are 3 by 45 and 3 by 46; an illustrative combined scoring batch is 6 by 46. Attention masks cover token positions and marker masks cover option slots.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#38556f"/>
    </marker>
    <style>
      .title { font: 700 27px Arial, Helvetica, sans-serif; fill: #142b40; }
      .subtitle { font: 18px Arial, Helvetica, sans-serif; fill: #52677b; }
      .heading { font: 700 19px Arial, Helvetica, sans-serif; fill: #142b40; }
      .body { font: 18px Arial, Helvetica, sans-serif; fill: #20384d; }
      .small { font: 16px Arial, Helvetica, sans-serif; fill: #365066; }
      .tiny { font: 14px Arial, Helvetica, sans-serif; fill: #52677b; }
      .on-dark { font: 700 15px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .card { stroke-width: 2; rx: 16; }
      .arrow { stroke: #38556f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .cell { stroke: #8aa0b3; stroke-width: 1; }
    </style>
  </defs>

  <rect width="900" height="1080" fill="#fbfcfe"/>
  <text x="40" y="45" class="title">Batching preserves source rows</text>
  <text x="40" y="76" class="subtitle">Captured per-source shapes stay distinct from this explanatory combined-batch view.</text>

  <rect x="40" y="115" width="255" height="125" class="card" fill="#e6f1fb" stroke="#4f86b5"/>
  <text x="64" y="152" class="heading">Source state A</text>
  <text x="64" y="185" class="body">3 questions -> 3 rows</text>
  <text x="64" y="218" class="body">captured: [3,45]</text>

  <rect x="40" y="270" width="255" height="125" class="card" fill="#e6f1fb" stroke="#4f86b5"/>
  <text x="64" y="307" class="heading">Source state B</text>
  <text x="64" y="340" class="body">3 questions -> 3 rows</text>
  <text x="64" y="373" class="body">captured: [3,46]</text>

  <path d="M295 178 H350 V240 H390" class="arrow"/>
  <path d="M295 333 H350 V285 H390" class="arrow"/>

  <rect x="390" y="145" width="270" height="250" class="card" fill="#fff4d6" stroke="#b7791f"/>
  <text x="414" y="183" class="heading">Combined scoring</text>
  <text x="414" y="218" class="body">B=6 logical rows</text>
  <text x="414" y="249" class="small">2 states x 3 questions</text>
  <text x="414" y="286" class="body">illustrative [6,46]</text>
  <text x="414" y="317" class="small">repad to max L, flatten,</text>
  <text x="414" y="343" class="small">score, then slice outputs</text>
  <text x="414" y="375" class="tiny">not a new captured trace</text>

  <path d="M660 270 H700" class="arrow"/>
  <rect x="700" y="145" width="160" height="250" class="card" fill="#e7f5e9" stroke="#3b7d4a"/>
  <text x="724" y="183" class="heading">Regroup</text>
  <text x="724" y="225" class="body">rows 1-3</text>
  <text x="724" y="253" class="small">result A</text>
  <text x="724" y="300" class="body">rows 4-6</text>
  <text x="724" y="328" class="small">result B</text>
  <text x="724" y="365" class="tiny">within one cursor</text>
  <text x="724" y="386" class="tiny">not across cursors</text>

  <rect x="40" y="455" width="400" height="495" class="card" fill="#f2f5f8" stroke="#8aa0b3"/>
  <text x="68" y="495" class="heading">B, L, K and attention_mask</text>
  <text x="68" y="535" class="body">B = logical question rows</text>
  <text x="68" y="563" class="small">6 here: 2 states x 3 questions</text>
  <text x="68" y="608" class="body">L = token positions</text>
  <text x="68" y="636" class="small">45 or 46 before repadding</text>
  <text x="68" y="681" class="body">K = option slots</text>
  <text x="68" y="709" class="small">K=3; padded slots are not decoded</text>
  <text x="68" y="754" class="body">attention_mask</text>
  <text x="68" y="781" class="small">applies to token positions:</text>
  <g transform="translate(78 810)">
    <rect x="0" y="0" width="42" height="38" class="cell" fill="#3b7d4a"/>
    <rect x="42" y="0" width="42" height="38" class="cell" fill="#3b7d4a"/>
    <rect x="84" y="0" width="42" height="38" class="cell" fill="#3b7d4a"/>
    <rect x="126" y="0" width="42" height="38" class="cell" fill="#dce5ec"/>
    <rect x="168" y="0" width="42" height="38" class="cell" fill="#dce5ec"/>
    <rect x="210" y="0" width="42" height="38" class="cell" fill="#dce5ec"/>
    <text x="14" y="26" class="on-dark">1</text>
    <text x="56" y="26" class="on-dark">1</text>
    <text x="98" y="26" class="on-dark">1</text>
    <text x="142" y="26" class="body">0</text>
    <text x="184" y="26" class="body">0</text>
    <text x="226" y="26" class="body">0</text>
  </g>
  <text x="68" y="888" class="tiny">Cells are schematic; no token IDs or offsets are invented.</text>
  <text x="68" y="918" class="tiny">1=nonpadding, 0=padding.</text>

  <rect x="460" y="455" width="400" height="495" class="card" fill="#fff0e3" stroke="#c96c25"/>
  <text x="488" y="495" class="heading">K=3 marker_mask</text>
  <text x="488" y="530" class="small">Option-slot validity, not token padding.</text>
  <text x="488" y="570" class="body">question</text>
  <text x="642" y="570" class="small">0</text>
  <text x="712" y="570" class="small">1</text>
  <text x="782" y="570" class="small">2</text>
  <line x1="488" y1="585" x2="832" y2="585" stroke="#dfb88f" stroke-width="1"/>

  <text x="488" y="630" class="body">priority</text>
  <rect x="625" y="604" width="50" height="38" rx="6" fill="#3b7d4a"/>
  <rect x="695" y="604" width="50" height="38" rx="6" fill="#3b7d4a"/>
  <rect x="765" y="604" width="50" height="38" rx="6" fill="#dce5ec"/>
  <text x="640" y="630" class="on-dark">T</text>
  <text x="710" y="630" class="on-dark">T</text>
  <text x="780" y="630" class="body">F</text>

  <text x="488" y="710" class="body">quality</text>
  <rect x="625" y="684" width="50" height="38" rx="6" fill="#3b7d4a"/>
  <rect x="695" y="684" width="50" height="38" rx="6" fill="#3b7d4a"/>
  <rect x="765" y="684" width="50" height="38" rx="6" fill="#3b7d4a"/>
  <text x="640" y="710" class="on-dark">T</text>
  <text x="710" y="710" class="on-dark">T</text>
  <text x="780" y="710" class="on-dark">T</text>

  <text x="488" y="790" class="body">actionable</text>
  <rect x="625" y="764" width="50" height="38" rx="6" fill="#3b7d4a"/>
  <rect x="695" y="764" width="50" height="38" rx="6" fill="#3b7d4a"/>
  <rect x="765" y="764" width="50" height="38" rx="6" fill="#dce5ec"/>
  <text x="640" y="790" class="on-dark">T</text>
  <text x="710" y="790" class="on-dark">T</text>
  <text x="780" y="790" class="body">F</text>

  <text x="488" y="855" class="tiny">T=valid option, F=padded slot.</text>
  <text x="488" y="885" class="tiny">Padded logits never become real options.</text>
  <text x="488" y="918" class="tiny">Different L values do not require separate calls.</text>
</svg>
