name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typed-decision-samples:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Smoke test file-based typed-decision samples
        run: |
          dotnet run --file samples/TypedDecisions/MLNetPipeline/Program.cs -- --help

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for MinVer

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: |
          dotnet pack src/MLNet.TextInference.Onnx/ --no-build --configuration Release --output ./artifacts
          dotnet pack src/MLNet.TextGeneration.OnnxGenAI/ --no-build --configuration Release --output ./artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
